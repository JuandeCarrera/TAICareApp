[build]
  base    = "frontend/taicare-web"
  command = "npm run build"
  publish = "frontend/taicare-web/dist"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
